<style>
#mkModal{display:none;position:fixed;inset:0;z-index:100300;background:#fffaf0;flex-direction:column;color:#1f2937;font-family:inherit}
#mkModal.open{display:flex}
#mkApp{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
#mkApp *{box-sizing:border-box}
.mk-h{background:#ef6c00;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.mk-h h2{margin:0;flex:1;font-size:20px;font-weight:900;line-height:1.25}
.mk-h button{border:0;background:rgba(255,255,255,.25);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:900}
.mk-sub{margin:12px 16px 4px;font-size:13px;font-weight:900;color:#92400e}
.mk-li{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:10px 16px;padding:14px;border:0;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(120,53,15,.18);text-align:left;font-size:20px;font-weight:900;color:#1f2937}
.mk-no{flex:0 0 46px;height:46px;border-radius:50%;background:#e53935;color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
.mk-li small{display:block;font-size:12px;color:#78716c;font-weight:700;margin-top:2px}
.mk-li .p{margin-left:auto;font-size:22px;color:#a8a29e}
.mk-tabs{display:flex;background:#fed7aa;gap:6px;padding:8px 10px}
.mk-tabs button{flex:1;padding:13px;border:3px solid transparent;border-radius:16px;color:#fff;font-weight:900;font-size:17px;opacity:.55}
.mk-tabs button.tr{background:#2563eb}.mk-tabs button.tw{background:#16a34a}
.mk-tabs button.on{opacity:1;border-color:#1f2937;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mk-tabs button.tg{background:#9333ea}
.mk-pic{display:block;margin:0 auto 6px;max-width:210px;max-height:170px;border-radius:14px}
.mk-gc{display:flex;flex-direction:column;gap:10px;margin:10px 16px}
.mk-gc button{padding:16px;border-radius:18px;border:3px solid #fdba74;background:#fff;font-size:34px;font-weight:800;color:#1f2937}
.mk-gc button.ok{background:#dcfce7;border-color:#16a34a}.mk-gc button.no{background:#fee2e2;border-color:#dc2626}
.mk-cnt{text-align:center;margin:12px 0 4px;font-weight:900;color:#78716c}
.mk-card{margin:8px 16px;padding:18px 12px;background:#fff;border-radius:24px;box-shadow:0 3px 12px rgba(120,53,15,.2);text-align:center}
.mk-big{font-size:110px;line-height:1.25;font-weight:700;color:#1f2937;word-break:keep-all}
.mk-big.w{font-size:68px}.mk-big.s{font-size:30px;line-height:1.6;font-weight:800}
.mk-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 16px}
.mk-b{border:0;border-radius:18px;padding:14px 20px;font-size:18px;font-weight:900;color:#fff;background:#2563eb}
.mk-b.g{background:#16a34a}.mk-b.r{background:#dc2626}.mk-b.o{background:#ea580c}.mk-b.x{background:#e7e5e4;color:#44403c}
.mk-b.listen{background:#0ea5e9}.mk-b.mic{background:#e11d48}
.mk-b.rec{animation:mkp 1s infinite}
@keyframes mkp{50%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(225,29,72,.25)}}
.mk-res{margin:8px 16px;padding:12px;border-radius:16px;text-align:center;font-size:18px;font-weight:900}
.mk-res.ok{background:#dcfce7;color:#166534}.mk-res.no{background:#fee2e2;color:#991b1b}.mk-res.info{background:#fef3c7;color:#92400e;font-size:14px;font-weight:700}
.mk-star{font-size:34px;letter-spacing:4px}
.mk-nav{display:flex;gap:12px;margin:14px 16px}
.mk-nav button{flex:1;padding:15px;border-radius:18px;border:2px solid #fdba74;background:#fff;font-size:18px;font-weight:900;color:#9a3412}
.mk-nav button.pri{background:#ef6c00;border-color:#ef6c00;color:#fff}
.mk-nav button:disabled{opacity:.4}
.mk-cv{position:relative;margin:8px 16px;background:#fff;border-radius:20px;box-shadow:0 3px 12px rgba(120,53,15,.2);overflow:hidden;touch-action:none}
.mk-cv canvas{display:block;width:100%;height:auto;touch-action:none}
.mk-cv .ink{position:absolute;left:0;top:0}
.mk-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px}
.mk-chips button{min-width:40px;height:40px;border-radius:12px;border:1.5px solid #fdba74;background:#fff;font-weight:900;font-size:17px;color:#7c2d12}
.mk-chips button.on{background:#ef6c00;color:#fff;border-color:#ef6c00}
.mk-chips button.d{background:#dcfce7;border-color:#16a34a;color:#166534}
.mk-note{margin:12px 16px;padding:12px;background:#fff;border:1px solid #fed7aa;border-radius:14px;font-size:14px;line-height:1.5}

  function norm(s){return String(s||'').replace(/[‌‍\s.,!?।'"‘’“”\-–]/g,'');}
  function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=1;j<=n;j++)d[0][j]=j;

  function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length);}
  function judge(target,alts){
    /* कडक तपासणी: फक्त पहिली ३ ऐकलेली रूपे; अक्षर = तंतोतंत; शब्द = तंतोतंत किंवा ८५%+ (फक्त मोठ्या शब्दांत एक चूक); वाक्य = ८५% शब्द जुळावेत */
    var t=norm(target),a3=alts.slice(0,3),isSent=/\s/.test(String(target).trim()),best=0,exact=false;
    if(isSent){
      var tw=String(target).split(/\s+/).map(norm).filter(Boolean);
      a3.forEach(function(a){var aw=String(a).split(/\s+/).map(norm).filter(Boolean),hit=0;

        var s=tw.length?hit/tw.length:0;if(s>best)best=s;});
      return {ok:best>=0.85,stars:best>=0.99?3:(best>=0.85?2:0),best:best};

      return h+'<div class="mk-card"><div style="font-size:64px">🎉</div><div class="mk-big s">'+num(G_.sc)+' / '+num(n)+' बरोबर</div>'+stars(st)+'</div><div class="mk-btns"><button type="button" class="mk-b g" onclick="mkGame_()">🔁 पुन्हा खेळा</button></div>';}
    var c=G_.order[G_.q];
    h+='<div class="mk-cnt">'+num(G_.q+1)+' / '+num(n)+' • चित्राला योग्य शब्द निवडा</div><div class="mk-card"><img class="mk-pic" style="max-width:240px;max-height:200px" alt="" src="'+PIC[c]+'"></div>';
    h+='<div class="mk-gc">'+G_.ch.map(function(x){var cl=G_.pick===null?'':(x===c?'ok':(x===G_.pick?'no':''));return '<button type="button" class="'+cl+'" onclick="mkPick_(\''+x+'\')">'+esc(x)+'</button>';}).join('')+'</div>';
    if(G_.pick!==null)h+='<div class="mk-res '+(G_.pick===c?'ok':'no')+'">'+(G_.pick===c?'✅ बरोबर! ':'🔁 बरोबर उत्तर: '+esc(c))+'</div><div class="mk-nav"><button type="button" class="pri" onclick="mkNext_()">पुढील ›</button></div>';
    return h;}
  window.mkGame_=function(){gameNew();render();};
  window.mkPick_=function(x){if(G_.pick!==null)return;G_.pick=x;var c=G_.order[G_.q];if(x===c)G_.sc++;speak(c);render();};
  window.mkNext_=function(){G_.q++;G_.pick=null;gameOpts();render();};
  function setItems(){S.i=0;S.res=null;S.items=S.view==='sent'?S.les.S.slice():S.les.L.concat(S.les.W);}
  /* ---------- रेंडर ---------- */
  function stars(n){return n?'<span class="mk-star">'+'⭐'.repeat(n)+'</span>':'';}
  function render(){
    var a=el('mkApp'),h='';
    if(S.view==='home'){
      var p=prog();
      h='<div class="mk-h"><h2>इयत्ता १ ली • मराठी<br><small style="font-weight:700;font-size:13px">मुळाक्षर वाचन आणि लेखन सराव</small></h2><button type="button" onclick="mkBack_()">✕</button></div><div class="mk-sub">पाठ निवडा</div>';
      LES.forEach(function(l,i){
        var tot=l.L.length+l.W.length,done=0;l.L.concat(l.W).forEach(function(x){if(p['l|'+l.no+'|r|'+x])done++;});
        h+='<button type="button" class="mk-li" onclick="mkLes_('+i+')"><span class="mk-no">'+num(l.no)+'</span><span>'+esc(l.t)+'<small>'+num(tot)+' घटक • वाचन ✔ '+num(done)+'</small></span><span class="p">▶</span></button>';
      });
      h+='<div class="mk-sub">वाक्य वाचन</div>';
      SENT.forEach(function(s,i){h+='<button type="button" class="mk-li" onclick="mkSent_('+i+')"><span class="mk-no" style="background:#2563eb">'+num(s.n)+'</span><span>'+esc(s.t)+'<small>'+num(s.S.length)+' वाक्ये</small></span><span class="p">▶</span></button>';});
    }else{
      var it=S.items[S.i],isW=S.tab==='write',n=S.items.length;
      if(S.tab==='game'&&S.view==='les'){h=gameHtml();var a0=el('mkApp');a0.innerHTML=h;a0.scrollTop=0;return;}
      h='<div class="mk-h"><button type="button" onclick="mkBack_()">‹</button><h2>'+esc(S.les.t)+'</h2><button type="button" onclick="closeMulakshar_()">✕</button></div>';
      if(S.view==='les')h+='<div class="mk-tabs"><button type="button" class="tr '+(!isW?'on':'')+'" onclick="mkTab_(\'read\')">📖 वाचन</button><button type="button" class="tw '+(isW?'on':'')+'" onclick="mkTab_(\'write\')">✍️ लेखन</button>'+(gameWords().length>=3?'<button type="button" class="tg '+(S.tab==='game'?'on':'')+'" onclick="mkTab_(\'game\')">🎮 खेळ</button>':'')+'</div>';
      h+='<div class="mk-cnt">'+num(S.i+1)+' / '+num(n)+'</div>';
      if(!isW){
        var sz=S.view==='sent'?'s':(it.length>2?'w':'');
        h+='<div class="mk-card">'+(PIC[it]?'<img class="mk-pic" alt="" src="'+PIC[it]+'">':'')+'<div class="mk-big '+sz+'">'+esc(it)+'</div></div>';
        h+='<div class="mk-btns"><button type="button" class="mk-b listen" onclick="mkSay_()">🔊 ऐका</button><button type="button" class="mk-b mic'+(S.rec?' rec':'')+'" onclick="mkMic_()">'+(S.rec?'🎤 ऐकत आहे...':'🎤 वाचा')+'</button></div>';
        if(S.res){h+='<div class="mk-res '+S.res.t+'">'+(S.res.t==='ok'?'✅ ':S.res.t==='no'?'🔁 ':'ℹ️ ')+esc(S.res.m)+(S.res.stars?'<br>'+stars(S.res.stars):'')+(S.res.heard?'<br><small style="font-weight:700">ऐकले: '+esc(S.res.heard)+'</small>':'')+'</div>';
          if(S.res.web&&MK_WEB)h+='<div class="mk-btns"><a class="mk-b o" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(MK_WEB+'?les='+S.les.no+(S.view==="sent"?"&sent=1":""))+'">🌐 माइकसाठी वेगळ्या पानावर उघडा</a></div>';
          if(S.res.manual)h+='<div class="mk-btns"><button type="button" class="mk-b g" onclick="mkManual_(true)">✔ बरोबर वाचले</button><button type="button" class="mk-b x" onclick="mkManual_(false)">✖ पुन्हा</button></div>';}
      }else{
        h+='<div class="mk-cv" id="mkCv"><canvas id="mkG" width="640" height="320"></canvas><canvas id="mkI" class="ink" width="640" height="320"></canvas></div>';
        h+='<div class="mk-btns"><button type="button" class="mk-b listen" onclick="mkSay_()">🔊 ऐका</button><button type="button" class="mk-b x" onclick="mkClear_()">🧽 पुसा</button><button type="button" class="mk-b g" onclick="mkCheck_()">✔ तपासा</button></div>';
        h+='<div id="mkWR">'+(S.res?'<div class="mk-res '+S.res.t+'">'+esc(S.res.m)+(S.res.stars?'<br>'+stars(S.res.stars):'')+'</div>':'<div class="mk-note">ठिपक्यांच्या/हलक्या अक्षरावरून बोटाने गिरवा, मग "तपासा" दाबा.</div>')+'</div>';
      }
      h+='<div class="mk-nav"><button type="button" onclick="mkGo_(-1)"'+(S.i===0?' disabled':'')+'>‹ मागील</button><button type="button" class="pri" onclick="mkGo_(1)"'+(S.i>=n-1?' disabled':'')+'>पुढील ›</button></div>';
      if(n>1&&n<=60){h+='<div class="mk-chips">'+S.items.map(function(x,i){var d=prog()[(S.view==='sent'?'s':'l')+'|'+S.les.no+'|'+(isW?'w':'r')+'|'+x];return '<button type="button" class="'+(i===S.i?'on ':'')+(d?'d':'')+'" onclick="mkJump_('+i+')">'+esc(S.view==='sent'?num(i+1):x)+'</button>';}).join('')+'</div>';}
    }
    var sc=a.scrollTop;a.innerHTML=h;a.scrollTop=(S.view==='home')?sc:0;
    if(S.view!=='home'&&S.tab==='write')initCanvas();
  }
  /* ---------- लेखन (गिरवणे) ---------- */
  var CW=640,CH=320,FONT='"Noto Sans Devanagari","Mukta","Nirmala UI","Lohit Devanagari",sans-serif';
  var strokes=[],cur=null;
  function fit(ctx,text){var px=250;ctx.font='700 '+px+'px '+FONT;var w=ctx.measureText(text).width;if(w>CW*0.9)px=Math.floor(px*CW*0.9/w);ctx.font='700 '+px+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';return px;}
  function drawGuide(ctx,text,mode){fit(ctx,text);var y=CH/2+8;
    if(mode==='show'){ctx.fillStyle='#d6d3d1';ctx.fillText(text,CW/2,y);ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.strokeStyle='#78716c';ctx.strokeText(text,CW/2,y);}
    else if(mode==='fill'){ctx.fillStyle='#000';ctx.fillText(text,CW/2,y);}
    else if(mode==='dil'){ctx.fillStyle='#000';ctx.fillText(text,CW/2,y);ctx.lineJoin='round';ctx.lineWidth=44;ctx.strokeStyle='#000';ctx.strokeText(text,CW/2,y);}
  }
  function initCanvas(){
    strokes=[];cur=null;var g=el('mkG'),ink=el('mkI');if(!g)return;
    var gc=g.getContext('2d');gc.clearRect(0,0,CW,CH);gc.fillStyle='#fff';gc.fillRect(0,0,CW,CH);
    gc.strokeStyle='#e7e5e4';gc.lineWidth=1;gc.setLineDash([4,6]);gc.beginPath();gc.moveTo(0,CH*0.78);gc.lineTo(CW,CH*0.78);gc.moveTo(0,CH*0.22);gc.lineTo(CW,CH*0.22);gc.stroke();gc.setLineDash([]);
    drawGuide(gc,S.items[S.i],'show');
    function pos(e){var r=ink.getBoundingClientRect();return [(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height];}
    var ic=ink.getContext('2d');
    ink.onpointerdown=function(e){e.preventDefault();try{ink.setPointerCapture(e.pointerId);}catch(x){}cur=[pos(e)];strokes.push(cur);redraw();};
    ink.onpointermove=function(e){if(!cur)return;e.preventDefault();cur.push(pos(e));redraw();};
    ink.onpointerup=ink.onpointercancel=function(e){cur=null;};
    ink.style.touchAction='none';
  }
  function strokePath(ctx,w,color){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=color;
    strokes.forEach(function(s){ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);if(s.length===1)ctx.lineTo(s[0][0]+0.1,s[0][1]);for(var i=1;i<s.length;i++)ctx.lineTo(s[i][0],s[i][1]);ctx.stroke();});}
  function redraw(){var ink=el('mkI');if(!ink)return;var c=ink.getContext('2d');c.clearRect(0,0,CW,CH);strokePath(c,12,'#2563eb');}
  window.mkClear_=function(){strokes=[];cur=null;redraw();S.res=null;var w=el('mkWR');if(w)w.innerHTML='<div class="mk-note">पुन्हा गिरवा.</div>';};
  function cnv(){var c=document.createElement('canvas');c.width=CW;c.height=CH;return c;}
  function alphaOf(c){return c.getContext('2d').getImageData(0,0,CW,CH).data;}
  window.mkCheck_=function(){
    var text=S.items[S.i];
    if(!strokes.length){S.res={t:'info',m:'आधी गिरवा, मग तपासा.'};var w=el('mkWR');if(w)w.innerHTML='<div class="mk-res info">आधी गिरवा, मग तपासा.</div>';return;}
    var gm=cnv(),gx=gm.getContext('2d');drawGuide(gx,text,'fill');
    var dm=cnv(),dx=dm.getContext('2d');drawGuide(dx,text,'dil');
    var th=cnv(),tx=th.getContext('2d');strokePath(tx,36,'#000');
    var tn=cnv(),nx=tn.getContext('2d');strokePath(nx,10,'#000');
    var G=alphaOf(gm),D=alphaOf(dm),T=alphaOf(th),N=alphaOf(tn),gt=0,gc=0,nt=0,ni=0;
    for(var i=3;i<G.length;i+=4){
      if(G[i]>128){gt++;if(T[i]>0)gc++;}
      if(N[i]>0){nt++;if(D[i]>0)ni++;}
    }
    var cov=gt?gc/gt:0,prec=nt?ni/nt:0,fillr=gt?nt/gt:0,st=0;
    if(cov>=0.72&&prec>=0.75)st=3;else if(cov>=0.58&&prec>=0.6)st=2;else if(cov>=0.42&&prec>=0.45)st=1;
    var fillTooMuch=fillr>0.85;if(fillTooMuch&&st>1)st=1;
    var m=fillTooMuch?'अक्षर रंगवू नका, फक्त रेषेवरून गिरवा.':st===3?'वा! खूप छान गिरवले!':st===2?'छान! थोडे अजून नीट गिरवा.':st===1?'चांगला प्रयत्न! अक्षरावरून पुन्हा गिरवा.':'पुन्हा प्रयत्न करा. अक्षराच्या रेषेवरून गिरवा.';
    S.res={t:st>=2?'ok':'no',m:m,stars:st,cov:cov,prec:prec};
    if(st)saveProg('l|'+(S.les.no)+'|w|'+text,st);
    var w=el('mkWR');if(w)w.innerHTML='<div class="mk-res '+S.res.t+'">'+esc(m)+(st?'<br>'+stars(st):'')+'<br><small style="font-weight:700">अचूकता: '+num(Math.round(cov*100))+'% • रेषेवर: '+num(Math.round(prec*100))+'%</small></div>';
    window.__mkLast={cov:cov,prec:prec,fillr:fillr,st:st};
  };
  if(window.speechSynthesis&&speechSynthesis.getVoices)speechSynthesis.getVoices();
  /* स्वतंत्र पान (Apps Script नसताना): थेट उघडा, ?les=पाठ क्र. */
  if(typeof google==='undefined'||!google.script){
    window.addEventListener('load',function(){
      openMulakshar_();
      try{var q=new URLSearchParams(location.search),n=Number(q.get('les'));
        if(n){var sent=q.get('sent');if(sent){for(var i=0;i<SENT.length;i++)if(SENT[i].n===n){mkSent_(i);break;}}else{for(var j=0;j<LES.length;j++)if(LES[j].no===n){mkLes_(j);break;}}}}catch(e){}
    });
  }
})();
</script>
