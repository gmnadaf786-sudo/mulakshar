  function speak(t){
    try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='kn-IN';u.rate=0.8;
      var vs=speechSynthesis.getVoices()||[],v=vs.filter(function(x){return /^kn/i.test(x.lang);})[0]||vs.filter(function(x){return /^(hi|te|ta)/i.test(x.lang);})[0];

  /* ---------- जुळवणी ---------- */
  function norm(s){return String(s||'').replace(/[‌‍\s.,!?।'"‘’“”\-–]/g,'');}
  function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=1;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
  function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length);}
  function judge(target,alts){
    /* कडक तपासणी: फक्त पहिली ३ ऐकलेली रूपे; अक्षर = तंतोतंत; शब्द = तंतोतंत किंवा ८५%+ (फक्त मोठ्या शब्दांत एक चूक); वाक्य = ८५% शब्द जुळावेत */
    var t=norm(target),a3=alts.slice(0,3),isSent=/\s/.test(String(target).trim()),best=0,exact=false;
    if(isSent){
      var tw=String(target).split(/\s+/).map(norm).filter(Boolean);
      a3.forEach(function(a){var aw=String(a).split(/\s+/).map(norm).filter(Boolean),hit=0;
        tw.forEach(function(w,i){if(aw.some(function(x){return x===w||(w.length>=6&&sim(x,w)>=0.85);}))hit++;});
        var s=tw.length?hit/tw.length:0;if(s>best)best=s;});
      return {ok:best>=0.85,stars:best>=0.99?3:(best>=0.85?2:0),best:best};
    }
    a3.forEach(function(a){if(norm(a)===t)exact=true;});
    if(exact)return {ok:true,stars:3,best:1};
    if(t.length<=2)return {ok:false,stars:0,best:0};
    best=sim(a3[0]||'',target);
    return best>=0.85?{ok:true,stars:2,best:best}:{ok:false,stars:0,best:best};
  }

  function listen(target){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){S.res={t:'info',m:'ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ತಪಾಸಣೆ ಲಭ್ಯವಿಲ್ಲ. ಶಿಕ್ಷಕರು "ಸರಿ/ತಪ್ಪು" ಒತ್ತಿ.',manual:true};render();return;}
    var r=new SR();r.lang='kn-IN';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;

      return h+'<div class="mk-card"><div style="font-size:64px">🎉</div><div class="mk-big s">'+num(G_.sc)+' / '+num(n)+' ಸರಿ</div>'+stars(st)+'</div><div class="mk-btns"><button type="button" class="mk-b g" onclick="mkGame_()">🔁 ಮತ್ತೆ ಆಡಿ</button></div>';}
    var c=G_.order[G_.q];
    h+='<div class="mk-cnt">'+num(G_.q+1)+' / '+num(n)+' • ಚಿತ್ರಕ್ಕೆ ಸರಿಯಾದ ಪದ ಆರಿಸಿ</div><div class="mk-card"><img class="mk-pic" style="max-width:240px;max-height:200px" alt="" src="'+PIC[c]+'"></div>';
    h+='<div class="mk-gc">'+G_.ch.map(function(x){var cl=G_.pick===null?'':(x===c?'ok':(x===G_.pick?'no':''));return '<button type="button" class="'+cl+'" onclick="mkPick_(\''+x+'\')">'+esc(x)+'</button>';}).join('')+'</div>';
    if(G_.pick!==null)h+='<div class="mk-res '+(G_.pick===c?'ok':'no')+'">'+(G_.pick===c?'✅ ಸರಿ! ':'🔁 ಸರಿ ಉತ್ತರ: '+esc(c))+'</div><div class="mk-nav"><button type="button" class="pri" onclick="mkNext_()">ಮುಂದೆ ›</button></div>';
    return h;}
  window.mkGame_=function(){gameNew();render();};
  window.mkPick_=function(x){if(G_.pick!==null)return;G_.pick=x;var c=G_.order[G_.q];if(x===c)G_.sc++;speak(c);render();};
  window.mkNext_=function(){G_.q++;G_.pick=null;gameOpts();render();};
  function setItems(){S.i=0;S.res=null;S.items=S.view==='sent'?S.les.S.slice():S.les.L.concat(S.les.W);}
  /* ---------- रेंडर ---------- */
  function stars(n){return n?'<span class="mk-star">'+'⭐'.repeat(n)+'</span>':'';}
  function render(){
    var a=el('mkApp'),h='';
    if(S.view==='home'){
      var p=prog();
      h='<div class="mk-h"><h2>ಒಂದನೇ ತರಗತಿ • ಕನ್ನಡ<br><small style="font-weight:700;font-size:13px">ಅಕ್ಷರ ಓದು ಮತ್ತು ಬರಹ ಅಭ್ಯಾಸ</small></h2><button type="button" onclick="mkBack_()">✕</button></div><div class="mk-sub">ಪಾಠ ಆಯ್ಕೆಮಾಡಿ</div>';
      LES.forEach(function(l,i){
        var tot=l.L.length+l.W.length,done=0;l.L.concat(l.W).forEach(function(x){if(p['l|'+l.no+'|r|'+x])done++;});
        h+='<button type="button" class="mk-li" onclick="mkLes_('+i+')"><span class="mk-no">'+num(l.no)+'</span><span>'+esc(l.t)+'<small>'+num(tot)+' ಅಂಶಗಳು • ಓದಿದ ✔ '+num(done)+'</small></span><span class="p">▶</span></button>';
      });
    }else{
      var it=S.items[S.i],isW=S.tab==='write',n=S.items.length;
      if(S.tab==='game'&&S.view==='les'){h=gameHtml();var a0=el('mkApp');a0.innerHTML=h;a0.scrollTop=0;return;}
      h='<div class="mk-h"><button type="button" onclick="mkBack_()">‹</button><h2>'+esc(S.les.t)+'</h2><button type="button" onclick="closeKannada_()">✕</button></div>';
      if(S.view==='les')h+='<div class="mk-tabs"><button type="button" class="tr '+(!isW?'on':'')+'" onclick="mkTab_(\'read\')">📖 ಓದು</button><button type="button" class="tw '+(isW?'on':'')+'" onclick="mkTab_(\'write\')">✍️ ಬರೆ</button>'+(gameWords().length>=3?'<button type="button" class="tg '+(S.tab==='game'?'on':'')+'" onclick="mkTab_(\'game\')">🎮 ಆಟ</button>':'')+'</div>';
      h+='<div class="mk-cnt">'+num(S.i+1)+' / '+num(n)+'</div>';
      if(!isW){
        var sz=S.view==='sent'?'s':(it.length>7?'w2':(it.length>2?'w':''));
        h+='<div class="mk-card">'+(PIC[it]?'<img class="mk-pic" alt="" src="'+PIC[it]+'">':'')+'<div class="mk-big '+sz+'">'+esc(it)+'</div></div>';
        h+='<div class="mk-btns"><button type="button" class="mk-b listen" onclick="mkSay_()">🔊 ಕೇಳು</button><button type="button" class="mk-b mic'+(S.rec?' rec':'')+'" onclick="mkMic_()">'+(S.rec?'🎤 ಕೇಳುತ್ತಿದೆ...':'🎤 ಓದಿ')+'</button></div>';
        if(S.res){h+='<div class="mk-res '+S.res.t+'">'+(S.res.t==='ok'?'✅ ':S.res.t==='no'?'🔁 ':'ℹ️ ')+esc(S.res.m)+(S.res.stars?'<br>'+stars(S.res.stars):'')+(S.res.heard?'<br><small style="font-weight:700">ಕೇಳಿದ್ದು: '+esc(S.res.heard)+'</small>':'')+'</div>';
          if(S.res.web&&MK_WEB)h+='<div class="mk-btns"><a class="mk-b o" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(MK_WEB+'?les='+S.les.no+(S.view==="sent"?"&sent=1":""))+'">🌐 ಮೈಕ್‌ಗಾಗಿ ಬೇರೆ ಪುಟದಲ್ಲಿ ತೆರೆಯಿರಿ</a></div>';
          if(S.res.manual)h+='<div class="mk-btns"><button type="button" class="mk-b g" onclick="mkManual_(true)">✔ ಸರಿಯಾಗಿ ಓದಿದ</button><button type="button" class="mk-b x" onclick="mkManual_(false)">✖ ಮತ್ತೆ</button></div>';}
      }else{
        h+='<div class="mk-cv" id="mkCv"><canvas id="mkG" width="640" height="320"></canvas><canvas id="mkI" class="ink" width="640" height="320"></canvas></div>';
        h+='<div class="mk-btns"><button type="button" class="mk-b listen" onclick="mkSay_()">🔊 ಕೇಳು</button><button type="button" class="mk-b x" onclick="mkClear_()">🧽 ಅಳಿಸು</button><button type="button" class="mk-b g" onclick="mkCheck_()">✔ ಪರಿಶೀಲಿಸು</button></div>';
        h+='<div id="mkWR">'+(S.res?'<div class="mk-res '+S.res.t+'">'+esc(S.res.m)+(S.res.stars?'<br>'+stars(S.res.stars):'')+'</div>':'<div class="mk-note">ಚುಕ್ಕೆ ಗೆರೆಯ ಮೇಲೆ ಬೆರಳಿನಿಂದ ತಿದ್ದಿ, ನಂತರ "ಪರಿಶೀಲಿಸು" ಒತ್ತಿ.</div>')+'</div>';
      }
      h+='<div class="mk-nav"><button type="button" onclick="mkGo_(-1)"'+(S.i===0?' disabled':'')+'>‹ ಹಿಂದೆ</button><button type="button" class="pri" onclick="mkGo_(1)"'+(S.i>=n-1?' disabled':'')+'>ಮುಂದೆ ›</button></div>';
      if(n>1&&n<=60){h+='<div class="mk-chips">'+S.items.map(function(x,i){var d=prog()[(S.view==='sent'?'s':'l')+'|'+S.les.no+'|'+(isW?'w':'r')+'|'+x];return '<button type="button" class="'+(i===S.i?'on ':'')+(d?'d':'')+'" onclick="mkJump_('+i+')">'+esc(S.view==='sent'?num(i+1):x)+'</button>';}).join('')+'</div>';}
    }
    var sc=a.scrollTop;a.innerHTML=h;a.scrollTop=(S.view==='home')?sc:0;
    if(S.view!=='home'&&S.tab==='write')initCanvas();
  }
  /* ---------- लेखन (गिरवणे) ---------- */
  var CW=640,CH=320,FONT='"Noto Sans Kannada","Nirmala UI","Tunga","Lohit Kannada","Kedage",sans-serif';
  var strokes=[],cur=null;
  function fit(ctx,text){var px=250;ctx.font='700 '+px+'px '+FONT;var w=ctx.measureText(text).width;if(w>CW*0.9)px=Math.floor(px*CW*0.9/w);ctx.font='700 '+px+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';return px;}
  function drawGuide(ctx,text,mode){fit(ctx,text);var y=CH/2+8;
    if(mode==='show'){ctx.fillStyle='#d6d3d1';ctx.fillText(text,CW/2,y);ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.strokeStyle='#78716c';ctx.strokeText(text,CW/2,y);}
    else if(mode==='fill'){ctx.fillStyle='#000';ctx.fillText(text,CW/2,y);}
    else if(mode==='dil'){ctx.fillStyle='#000';ctx.fillText(text,CW/2,y);ctx.lineJoin='round';ctx.lineWidth=44;ctx.strokeStyle='#000';ctx.strokeText(text,CW/2,y);}
  }
  function initCanvas(){
    strokes=[];cur=null;var g=el('mkG'),ink=el('mkI');if(!g)return;
    var gc=g.getContext('2d');gc.clearRect(0,0,CW,CH);gc.fillStyle='#fff';gc.fillRect(0,0,CW,CH);
    gc.strokeStyle='#e7e5e4';gc.lineWidth=1;gc.setLineDash([4,6]);gc.beginPath();gc.moveTo(0,CH*0.78);gc.lineTo(CW,CH*0.78);gc.moveTo(0,CH*0.22);gc.lineTo(CW,CH*0.22);gc.stroke();gc.setLineDash([]);
    drawGuide(gc,S.items[S.i],'show');
    function pos(e){var r=ink.getBoundingClientRect();return [(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height];}
    var ic=ink.getContext('2d');
    ink.onpointerdown=function(e){e.preventDefault();try{ink.setPointerCapture(e.pointerId);}catch(x){}cur=[pos(e)];strokes.push(cur);redraw();};
    ink.onpointermove=function(e){if(!cur)return;e.preventDefault();cur.push(pos(e));redraw();};
    ink.onpointerup=ink.onpointercancel=function(e){cur=null;};
    ink.style.touchAction='none';
  }
  function strokePath(ctx,w,color){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=color;
    strokes.forEach(function(s){ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);if(s.length===1)ctx.lineTo(s[0][0]+0.1,s[0][1]);for(var i=1;i<s.length;i++)ctx.lineTo(s[i][0],s[i][1]);ctx.stroke();});}
  function redraw(){var ink=el('mkI');if(!ink)return;var c=ink.getContext('2d');c.clearRect(0,0,CW,CH);strokePath(c,12,'#2563eb');}
  window.mkClear_=function(){strokes=[];cur=null;redraw();S.res=null;var w=el('mkWR');if(w)w.innerHTML='<div class="mk-note">ಮತ್ತೆ ತಿದ್ದಿ.</div>';};
  function cnv(){var c=document.createElement('canvas');c.width=CW;c.height=CH;return c;}
  function alphaOf(c){return c.getContext('2d').getImageData(0,0,CW,CH).data;}
  window.mkCheck_=function(){
    var text=S.items[S.i];
    if(!strokes.length){S.res={t:'info',m:'ಮೊದಲು ತಿದ್ದಿ, ನಂತರ ಪರಿಶೀಲಿಸಿ.'};var w=el('mkWR');if(w)w.innerHTML='<div class="mk-res info">ಮೊದಲು ತಿದ್ದಿ, ನಂತರ ಪರಿಶೀಲಿಸಿ.</div>';return;}
    var gm=cnv(),gx=gm.getContext('2d');drawGuide(gx,text,'fill');
    var dm=cnv(),dx=dm.getContext('2d');drawGuide(dx,text,'dil');
    var th=cnv(),tx=th.getContext('2d');strokePath(tx,36,'#000');
    var tn=cnv(),nx=tn.getContext('2d');strokePath(nx,10,'#000');
    var G=alphaOf(gm),D=alphaOf(dm),T=alphaOf(th),N=alphaOf(tn),gt=0,gc=0,nt=0,ni=0;
    for(var i=3;i<G.length;i+=4){
      if(G[i]>128){gt++;if(T[i]>0)gc++;}
      if(N[i]>0){nt++;if(D[i]>0)ni++;}
    }
    var cov=gt?gc/gt:0,prec=nt?ni/nt:0,fillr=gt?nt/gt:0,st=0;
    if(cov>=0.72&&prec>=0.75)st=3;else if(cov>=0.58&&prec>=0.6)st=2;else if(cov>=0.42&&prec>=0.45)st=1;
    var fillTooMuch=fillr>0.85;if(fillTooMuch&&st>1)st=1;
    var m=fillTooMuch?'ಅಕ್ಷರಕ್ಕೆ ಬಣ್ಣ ಹಚ್ಚಬೇಡಿ, ಗೆರೆಯ ಮೇಲೆ ತಿದ್ದಿ.':st===3?'ಭೇಷ್! ಬಹಳ ಚೆನ್ನಾಗಿ ತಿದ್ದಿದೆ!':st===2?'ಚೆನ್ನಾಗಿದೆ! ಇನ್ನೂ ಸ್ವಲ್ಪ ಸರಿಯಾಗಿ ತಿದ್ದಿ.':st===1?'ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ! ಅಕ್ಷರದ ಮೇಲೆ ಮತ್ತೆ ತಿದ್ದಿ.':'ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ. ಅಕ್ಷರದ ಗೆರೆಯ ಮೇಲೆ ತಿದ್ದಿ.';
    S.res={t:st>=2?'ok':'no',m:m,stars:st,cov:cov,prec:prec};
    if(st)saveProg('l|'+(S.les.no)+'|w|'+text,st);
    var w=el('mkWR');if(w)w.innerHTML='<div class="mk-res '+S.res.t+'">'+esc(m)+(st?'<br>'+stars(st):'')+'<br><small style="font-weight:700">ನಿಖರತೆ: '+num(Math.round(cov*100))+'% • ಗೆರೆಯ ಮೇಲೆ: '+num(Math.round(prec*100))+'%</small></div>';
    window.__mkLast={cov:cov,prec:prec,fillr:fillr,st:st};
  };
  if(window.speechSynthesis&&speechSynthesis.getVoices)speechSynthesis.getVoices();
  /* स्वतंत्र पान (Apps Script नसताना): थेट उघडा, ?les=पाठ क्र. */
  if(typeof google==='undefined'||!google.script){
    window.addEventListener('load',function(){
      openKannada_();
      try{var q=new URLSearchParams(location.search),n=Number(q.get('les'));
        if(n){var sent=q.get('sent');if(sent){for(var i=0;i<SENT.length;i++)if(SENT[i].n===n){mkSent_(i);break;}}else{for(var j=0;j<LES.length;j++)if(LES[j].no===n){mkLes_(j);break;}}}}catch(e){}
    });
  }
})();
</script>
